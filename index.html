<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherMap &mdash; Real-Time Weather SPA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>WeatherMap</h1>
    <p class="subtitle">Real-time weather on an interactive map</p>
  </header>

  <main>
    <div class="search-card">
      <form id="weather-form" novalidate>
        <div class="input-group">
          <label for="location-input" class="sr-only">Location</label>
          <input type="text" id="location-input" placeholder="Enter a city, address or place&hellip;" autocomplete="off" aria-describedby="location-help">
          <button type="submit" id="get-weather-btn">Get Weather</button>
        </div>
      </form>
    </div>

    <div id="spinner" class="spinner" role="status" aria-hidden="true">
      <div class="spinner-ring"></div>
      <span class="sr-only">Loading&hellip;</span>
    </div>

    <div id="error-alert" class="alert alert-error" role="alert" aria-hidden="true">
      <span class="alert-icon">&#x26A0;</span>
      <span id="error-message"></span>
      <button type="button" id="close-alert">&times;</button>
    </div>

    <div id="map" class="map-container" aria-label="Weather map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
